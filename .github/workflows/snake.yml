name: Generate Snake Animation

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate-snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Snake Animation (Light)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: clerin-codes
          outputs: |
            dist/github-snake.svg?color_snake=00cc66&color_dots=#b0f0d0,#1f6b2e,#2ea043,#3dba56,#56d364&color_empty=#e8fff4&gap=2

      - name: Generate Snake Animation (Dark)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: clerin-codes
          outputs: |
            dist/github-snake-dark.svg?palette=github-dark&color_snake=00ccff&color_dots=#0d1117,#1f4db8,#2668ea,#3a7eff,#58a6ff&color_empty=0d1117&gap=2

      - name: Add grid lines + dual colour snake via SVG post-processing
        run: |
          python3 << 'EOF'
          import re

          def add_grid_and_recolor_snake(filepath, grid_color, head_color, body_color):
              with open(filepath, 'r') as f:
                  content = f.read()

              # Extract viewBox dimensions — supports negative offsets like "-16 -32 880 192"
              vb = re.search(r'viewBox="(-?[\d.]+)\s+(-?[\d.]+)\s+([\d.]+)\s+([\d.]+)"', content)
              if not vb:
                  print(f"No viewBox found in {filepath}")
                  return

              vx     = float(vb.group(1))
              vy     = float(vb.group(2))
              width  = float(vb.group(3))
              height = float(vb.group(4))
              cell   = 16  # standard snk cell size

              # --- Grid overlay (coordinates respect viewBox origin) ---
              grid_lines = '\n  <!-- Grid Overlay -->\n  <g opacity="0.15">\n'
              x = vx
              while x <= vx + width:
                  grid_lines += f'    <line x1="{int(x)}" y1="{int(vy)}" x2="{int(x)}" y2="{int(vy + height)}" stroke="{grid_color}" stroke-width="0.6"/>\n'
                  x += cell
              y = vy
              while y <= vy + height:
                  grid_lines += f'    <line x1="{int(vx)}" y1="{int(y)}" x2="{int(vx + width)}" y2="{int(y)}" stroke="{grid_color}" stroke-width="0.6"/>\n'
                  y += cell
              grid_lines += '  </g>\n'

              # Insert grid after opening <svg> tag (drawn first, behind snake/dots)
              content = re.sub(r'(<svg[^>]*>)', lambda m: m.group(1) + grid_lines, content, count=1)

              # --- Snake body colour: replace CSS variable --cs ---
              # snk v3 renders the snake using fill:var(--cs) in CSS, not inline fill attributes
              content = re.sub(r'(--cs:)[^;}"]+', r'\g<1>' + body_color, content)

              # --- Snake head colour: inject CSS rule targeting the head segment (class s0) ---
              # snk v3 renders the snake as <rect class="s s0/s1/s2/s3"> elements;
              # s0 is the head (largest, most rounded), s1-s3 are body segments
              head_css = f'.s.s0{{fill:{head_color}!important;}}'
              content = content.replace('</style>', head_css + '</style>', 1)

              with open(filepath, 'w') as f:
                  f.write(content)
              print(f"Grid + recolor done: {filepath}")

          # Light mode — green body, mint green head, blue grid
          add_grid_and_recolor_snake(
              'dist/github-snake.svg',
              grid_color  = '#0066ff',
              head_color  = '#00ff99',
              body_color  = '#00cc66',
          )

          # Dark mode — cyan body, mint green head, blue grid
          add_grid_and_recolor_snake(
              'dist/github-snake-dark.svg',
              grid_color  = '#0099ff',
              head_color  = '#00ff99',
              body_color  = '#00ccff',
          )
          EOF

      - name: Push snake to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          keep_history: false
          allow_empty_commit: false
          fqdn: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
