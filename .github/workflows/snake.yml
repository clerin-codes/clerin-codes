name: Generate Snake Animation

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate-snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Snake Animation (Light)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: clerin-codes
          outputs: |
            dist/github-snake.svg?color_snake=0066ff&color_dots=#b0d9ff,#1f4db8,#2668ea,#3a7eff,#58a6ff&color_empty=#e8f4ff&gap=2

      - name: Generate Snake Animation (Dark with Grid)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: clerin-codes
          outputs: |
            dist/github-snake-dark.svg?palette=github-dark&color_snake=0066ff&color_dots=#161b22,#1f4db8,#2668ea,#3a7eff,#58a6ff&color_empty=0d1117&gap=2

      - name: Add grid lines via SVG post-processing
        run: |
          python3 << 'EOF'
          import re
          def add_grid(filepath, bg_color, grid_color):
              with open(filepath, 'r') as f:
                  content = f.read()
              # Extract viewBox dimensions
              vb = re.search(r'viewBox="0 0 (\d+) (\d+)"', content)
              if not vb:
                  print(f"No viewBox found in {filepath}")
                  return
              width = int(vb.group(1))
              height = int(vb.group(2))
              cell = 16  # standard cell size used by snk
              # Build grid lines
              grid_lines = f'\n  <!-- Grid Overlay -->\n  <g opacity="0.18">\n'
              # vertical lines
              x = 0
              while x <= width:
                  grid_lines += f'    <line x1="{x}" y1="0" x2="{x}" y2="{height}" stroke="{grid_color}" stroke-width="0.7"/>\n'
                  x += cell
              # horizontal lines
              y = 0
              while y <= height:
                  grid_lines += f'    <line x1="0" y1="{y}" x2="{width}" y2="{y}" stroke="{grid_color}" stroke-width="0.7"/>\n'
                  y += cell
              grid_lines += '  </g>\n'
              # Insert grid just after opening <svg ...> tag
              content = re.sub(r'(<svg[^>]*>)', r'\1' + grid_lines, content, count=1)
              with open(filepath, 'w') as f:
                  f.write(content)
              print(f"Grid added to {filepath}")
          add_grid('dist/github-snake.svg',      '#e8f4ff', '#0066ff')
          add_grid('dist/github-snake-dark.svg', '#0d1117', '#0099ff')
          EOF

      - name: Push snake to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          keep_history: false
          allow_empty_commit: false
          fqdn: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
