name: Generate Snake Animation

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate-snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Snake Animation (Light)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: clerin-codes
          outputs: |
            dist/github-snake.svg?color_snake=00cc66&color_dots=#b0f0d0,#1f6b2e,#2ea043,#3dba56,#56d364&color_empty=#e8fff4&gap=2

      - name: Generate Snake Animation (Dark)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: clerin-codes
          outputs: |
            dist/github-snake-dark.svg?palette=github-dark&color_snake=00ccff&color_dots=#0d1117,#1f4db8,#2668ea,#3a7eff,#58a6ff&color_empty=0d1117&gap=2

      - name: Add grid lines + dual colour snake via SVG post-processing
        run: |
          python3 << 'EOF'
          import re

          def add_grid_and_recolor_snake(filepath, grid_color, head_color, body_color_1, body_color_2):
              with open(filepath, 'r') as f:
                  content = f.read()

              # Extract viewBox dimensions
              vb = re.search(r'viewBox="0 0 (\d+) (\d+)"', content)
              if not vb:
                  print(f"No viewBox found in {filepath}")
                  return

              width  = int(vb.group(1))
              height = int(vb.group(2))
              cell   = 16  # standard snk cell size

              # --- Grid overlay ---
              grid_lines = '\n  <!-- Grid Overlay -->\n  <g opacity="0.15">\n'
              x = 0
              while x <= width:
                  grid_lines += f'    <line x1="{x}" y1="0" x2="{x}" y2="{height}" stroke="{grid_color}" stroke-width="0.6"/>\n'
                  x += cell
              y = 0
              while y <= height:
                  grid_lines += f'    <line x1="0" y1="{y}" x2="{width}" y2="{y}" stroke="{grid_color}" stroke-width="0.6"/>\n'
                  y += cell
              grid_lines += '  </g>\n'

              # Insert grid after opening <svg> tag
              content = re.sub(r'(<svg[^>]*>)', r'\1' + grid_lines, content, count=1)

              # --- Snake head colour (first snake segment = head) ---
              # snk renders the snake head with a specific fill — recolor first circle/rect
              # Replace the very first snake-coloured element with head_color
              content = content.replace(f'fill="{body_color_1}"', f'fill="{head_color}"', 1)

              with open(filepath, 'w') as f:
                  f.write(content)
              print(f"Grid + recolor done: {filepath}")

          # Light mode — green snake (#00cc66), blue grid
          add_grid_and_recolor_snake(
              'dist/github-snake.svg',
              grid_color    = '#0066ff',
              head_color    = '#00ff99',   # bright mint green head
              body_color_1  = '#00cc66',   # green body start
              body_color_2  = '#0066ff',   # blue body end
          )

          # Dark mode — cyan/blue snake (#00ccff), blue grid
          add_grid_and_recolor_snake(
              'dist/github-snake-dark.svg',
              grid_color    = '#0099ff',
              head_color    = '#00ff99',   # bright mint green head
              body_color_1  = '#00ccff',   # cyan body start
              body_color_2  = '#0066ff',   # blue body end
          )
          EOF

      - name: Push snake to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          keep_history: false
          allow_empty_commit: false
          fqdn: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
